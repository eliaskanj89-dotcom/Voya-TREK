name: Voya migration CI

on:
  push:
    branches:
      - voya-rebrand
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voya-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build workspaces
        run: npm run build

      - name: Lint workspaces
        run: npm run lint

      - name: Voya itinerary invariants
        run: npm run test --workspace=server -- tests/unit/nest/voya-ai-multicity.test.ts tests/unit/nest/voya-ai-trip-edit.test.ts tests/unit/nest/voya-ai-history.test.ts
