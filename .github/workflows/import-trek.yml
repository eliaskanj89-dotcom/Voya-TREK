name: Import TREK baseline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import_trek:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Voya-TREK
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone pinned TREK baseline
        run: |
          rm -rf /tmp/trek
          git clone https://github.com/liketrek/TREK.git /tmp/trek
          cd /tmp/trek
          git checkout ed8acf4c4b642bcf4975f8d1ee43801fb3b65941

      - name: Copy TREK source tree
        run: |
          rsync -a --delete             --exclude='.git'             --exclude='.github/workflows'             /tmp/trek/ ./

      - name: Add Voya migration provenance
        run: |
          printf '%s\n'             '# Voya migration baseline'             ''             'This repository started from TREK v4.3.1 at upstream commit:'             '`ed8acf4c4b642bcf4975f8d1ee43801fb3b65941`.'             ''             'Upstream: https://github.com/liketrek/TREK'             ''             'TREK AGPL-3.0 licensing, copyright notices, NOTICE.md, and trademark terms are preserved.'             'Voya-specific changes are layered on top in later commits.'             > VOYA_MIGRATION.md

      - name: Commit baseline
        run: |
          git config user.name "Voya Migration Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No import changes to commit."
          else
            git commit -m "chore: import TREK v4.3.1 upstream baseline"
            git push origin HEAD:main
          fi
